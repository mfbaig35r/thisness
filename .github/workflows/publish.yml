name: Publish

# A version tag publishes to PyPI (tag-push, not a GitHub Release):
#   git tag v0.1.0 && git push origin v0.1.0
# Bump `version` in pyproject.toml and add a CHANGELOG.md entry first; the tag must match.
#
# One-time setup on pypi.org: add a trusted publisher for mfbaig35r/thisness, workflow
# publish.yml, environment pypi. No API token is stored anywhere.
on:
  push:
    tags: ["v*"]

env:
  PYTHONHASHSEED: "0"

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: The tag matches the version
        run: |
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv build
      - name: Metadata and README render for PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

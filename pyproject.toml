[project]
name = "thisness"
version = "0.2.0"
description = "Identity resolution for imperfect observations: evidence, stable identities, reversible history."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fahad Baig" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "duckdb>=1.3",
    "pyarrow>=17",
    "rapidfuzz>=3.9",
]
keywords = ["entity resolution", "record linkage", "identity resolution", "deduplication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The Workbench: `pip install thisness[ui]`, then `thisness ui identity.duckdb`.
ui = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

# Model providers for the LLM layer (design 05). The core never imports them.
anthropic = ["anthropic>=0.40"]
openai = ["httpx>=0.27"]

[project.scripts]
thisness = "thisness.cli:main"

[project.urls]
Homepage = "https://thisness.dev"
Repository = "https://github.com/mfbaig35r/thisness"

[dependency-groups]
dev = [
    "thisness[ui]",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thisness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Docs hold prose and design sketches; their code blocks are illustrative, not package code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["thisness"]
branch = true
